name: Manifest CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install
      - run: npm run lint

  compile:
    name: Compile Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Build Compact Contract via Docker
        run: |
          docker build -f Dockerfile.compiler -t manifest-compiler .
          docker create --name manifest-extract manifest-compiler
          docker cp manifest-extract:/app/managed/. managed/
          docker rm manifest-extract
      - name: Verify compiled artifacts
        run: |
          ls -la managed/contract
          ls -la managed/keys
          ls -la managed/zkir

  test:
    name: Test Smart Contract & Circuits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install
      - name: Install Root Dependencies
        run: npm install
      - name: Run Test Suite
        run: npm test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build

